<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RIVALS 3D — Web FPS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d16;color:#f3f7ff;font-family:Inter,Arial,"Noto Sans TC",sans-serif}button{font:inherit;color:white;background:#17283d;border:1px solid #ffffff2b;border-radius:8px;padding:11px 17px;cursor:pointer}button:hover{background:#2164a1}.primary{background:#1478d0;border-color:#55baff;font-weight:800}.screen{position:fixed;inset:0;display:none}.screen.active{display:flex}.menu{align-items:center;padding:8vw;background:radial-gradient(ellipse at 75% 50%,#16476b 0%,#0b192b 43%,#070b12 100%)}.menu:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#080d16 0%,transparent 90%);pointer-events:none}.content{position:relative;z-index:1;max-width:580px}.eyebrow{color:#61c1ff;letter-spacing:5px;font-size:12px;font-weight:bold}.logo{font-size:clamp(58px,10vw,112px);font-weight:1000;letter-spacing:-6px;line-height:1;margin:18px 0}.logo span{color:#59baff}.muted{color:#9aadc4;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:15px 22px;background:#07111ddd;border-bottom:1px solid #ffffff18;z-index:3}.brand{font-weight:900;letter-spacing:2px}.brand b{color:#5abaff}.panel{margin:auto;width:min(900px,92vw);padding:30px;background:#0d1b2bed;border:1px solid #ffffff22;border-radius:16px;box-shadow:0 25px 80px #0009}.panel h2{margin:0 0 8px;font-size:30px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:24px 0}.weapon{min-height:125px;text-align:left;background:#14263c;border-radius:12px;padding:16px}.weapon.selected{border-color:#62c2ff;background:#173b5c}.weapon .ico{font-size:30px;display:block;margin-bottom:12px}.game{background:#101923}.game canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none}.hudtop{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:8px}.pill{background:#06101bdc;border:1px solid #ffffff25;border-radius:8px;padding:10px 13px;font-size:13px}.cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:white;box-shadow:0 0 4px #000}.cross:before{width:2px;height:18px;left:9px}.cross:after{height:2px;width:18px;top:8px}.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#06101bdc;border-radius:7px;padding:8px 12px;font-size:12px;color:#c9d9e9;white-space:nowrap}.gamebuttons{position:absolute;top:65px;right:16px;pointer-events:auto}.touchmove{display:none;position:absolute;left:22px;bottom:28px;width:128px;height:128px;border:1px solid #ffffff55;border-radius:50%;background:#ffffff0b;pointer-events:auto;touch-action:none}.knob{position:absolute;left:40px;top:40px;width:46px;height:46px;border-radius:50%;background:#75bfff88;border:1px solid #c4e6ff}.touchlook{display:none;position:absolute;right:0;top:15%;width:48%;height:60%;pointer-events:auto;touch-action:none}.fire,.jump,.reload{display:none;position:absolute;pointer-events:auto;touch-action:none}.fire{right:25px;bottom:45px;width:78px;height:78px;border-radius:50%;background:#b73539d9;border:2px solid #ffb6b6;font-weight:900}.jump{right:115px;bottom:43px;border-radius:50%;width:58px;height:58px}.reload{right:28px;bottom:135px;padding:9px 12px}@media(pointer:coarse){.touchmove,.touchlook,.fire,.jump,.reload{display:block}.hint{bottom:7px;font-size:10px}}@media(max-width:600px){.panel{padding:20px}.topbar{padding:11px}.logo{letter-spacing:-3px}}
</style></head><body>
<section id="home" class="screen menu active"><div class="content"><div class="eyebrow">3D TACTICAL ARENA</div><div class="logo">RI<span>VALS</span></div><p class="muted">第一人稱 3D 射擊訓練原型。探索立體城市地圖、切換武器、瞄準並擊倒訓練機器人。</p><div class="actions"><button class="primary" id="play">▶ PLAY</button><button id="armoryOpen">🔫 武器庫</button><button id="lobbyOpen">🏙️ 大廳</button></div><p class="muted" style="font-size:12px;margin-top:30px">電腦：WASD 移動、滑鼠瞄準、左鍵射擊、空白鍵跳躍、R 裝填、Esc 暫停。手機：左側移動、右側滑動視角、按鈕射擊。</p></div></section>
<section id="armory" class="screen"><div class="topbar"><div class="brand">R<b>IVALS</b> / ARMORY</div><button data-back>返回</button></div><div class="panel"><h2>武器庫 / LOADOUT</h2><p class="muted">選擇進入訓練場時使用的武器。</p><div class="cards" id="weaponCards"></div><button class="primary" id="armoryPlay">使用配置並開始</button></div></section>
<section id="lobby" class="screen"><div class="topbar"><div class="brand">R<b>IVALS</b> / LOBBY</div><button data-back>返回</button></div><div class="panel"><h2>遊戲大廳</h2><p class="muted">選擇單人訓練內容。</p><div class="cards"><button class="weapon selected"><span class="ico">🏙️</span><b>城市交戰</b><p class="muted">3D 城市訓練地圖</p></button><button class="weapon"><span class="ico">🎯</span><b>目標練習</b><p class="muted">練習瞄準與命中</p></button><button class="weapon"><span class="ico">⚡</span><b>快速訓練</b><p class="muted">持續生成目標</p></button></div><button class="primary" id="lobbyPlay">▶ 進入地圖</button></div></section>
<section id="game" class="screen game"><div id="view" style="position:absolute;inset:0"></div><div class="hud"><div class="hudtop"><div class="pill">HP <b id="hp">100</b>　|　擊倒 <b id="kills">0</b></div><div class="pill"><b id="weaponName">RIFLE</b>　<span id="ammo">30 / ∞</span></div></div><div class="cross"></div><div class="hint" id="hint">WASD 移動・滑鼠瞄準・左鍵射擊</div><div class="gamebuttons"><button id="pause">暫停 / 離開</button></div><div class="touchmove" id="movePad"><div class="knob" id="knob"></div></div><div class="touchlook" id="lookPad"></div><button class="fire" id="fire">FIRE</button><button class="jump" id="jump">跳</button><button class="reload" id="reload">↻ 裝填</button></div></section>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id),screens=['home','armory','lobby','game'];function show(id){screens.forEach(s=>$(s).classList.toggle('active',s===id));if(id==='game')start();else stop()}document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('home'));$('play').onclick=()=>show('game');$('armoryOpen').onclick=()=>show('armory');$('lobbyOpen').onclick=()=>show('lobby');$('armoryPlay').onclick=()=>show('game');$('lobbyPlay').onclick=()=>show('game');$('pause').onclick=()=>show('home');
const guns=[{name:'RIFLE',icon:'🔫',damage:34,rate:170,mag:30,color:0x3f536b},{name:'BURST',icon:'💥',damage:48,rate:360,mag:21,color:0x526071},{name:'SCOUT',icon:'🎯',damage:90,rate:600,mag:10,color:0x6d6254},{name:'SMG',icon:'⚡',damage:19,rate:85,mag:40,color:0x405b50}];let selected=0;guns.forEach((g,i)=>{const b=document.createElement('button');b.className='weapon'+(!i?' selected':'');b.innerHTML='<span class="ico">'+g.icon+'</span><b>'+g.name+'</b><p class="muted">'+g.mag+' 發彈匣 · 傷害 '+g.damage+'</p>';b.onclick=()=>{selected=i;[...$('weaponCards').children].forEach((x,j)=>x.classList.toggle('selected',j===i))};$('weaponCards').appendChild(b)});
let scene,camera,renderer,clock,raycaster,targets=[],keys={},active=false,locked=false,ammo=30,kills=0,hp=100,lastShot=0,reloading=false,velY=0,onGround=true,joy={x:0,y:0},touchLook=null,fireHeld=false;const direction=new THREE.Vector3(),forward=new THREE.Vector3(),right=new THREE.Vector3();let yaw=0,pitch=0;
function mat(color,roughness=.8){return new THREE.MeshStandardMaterial({color,roughness})}
function box(x,y,z,sx,sy,sz,color){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(color));m.position.set(x,y,z);scene.add(m);return m}
function buildWorld(){scene=new THREE.Scene();scene.background=new THREE.Color(0x91b8d1);scene.fog=new THREE.Fog(0x91b8d1,45,150);camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,250);camera.position.set(0,1.7,12);scene.add(camera);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('view').replaceChildren(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd9edff,0x344252,2));const sun=new THREE.DirectionalLight(0xfff2d6,2.4);sun.position.set(-25,45,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
box(0,-.25,0,180,.5,180,0x43505a);const grid=new THREE.GridHelper(180,90,0x8ca0a9,0x61717c);grid.position.y=.015;scene.add(grid);
// Buildings, alleys, crates and cover
for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){if(Math.abs(x)<2&&Math.abs(z)<2)continue;if(Math.random()<.3)continue;const h=5+Math.random()*13,w=5+Math.random()*5,d=5+Math.random()*5,px=x*13,pz=z*13;const building=box(px,h/2,pz,w,h,d,Math.random()>.5?0x647481:0x526575);building.castShadow=true;building.receiveShadow=true;box(px,h+.08,pz,w+.3,.2,d+.3,0x354452);for(let fy=2;fy<h-1;fy+=2.8)for(let fx=-w/2+1;fx<w/2-0.5;fx+=2){const win=box(px+fx,fy,pz+d/2+.015,.9,1.15,.04,0x9bc9d6);win.material=mat(Math.random()>.35?0x6e9aa9:0xe1c98d,.3)}}
for(let i=0;i<28;i++){const x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;if(Math.abs(x)<9&&Math.abs(z)<9)continue;const c=box(x,.7,z,2.5,1.4,2.5,0x876b4d);c.castShadow=true}
targets=[];for(let i=0;i<9;i++)spawnTarget(true);raycaster=new THREE.Raycaster();clock=new THREE.Clock();camera.rotation.order='YXZ';}
function spawnTarget(initial=false){const group=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,4,8),mat(0xd34b4b));body.position.y=1.05;body.castShadow=true;group.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),mat(0xe6b3a0));head.position.y=1.85;group.add(head);const visor=new THREE.Mesh(new THREE.BoxGeometry(.43,.12,.08),mat(0x263644));visor.position.set(0,1.9,-.28);group.add(visor);const x=(Math.random()-.5)*54,z=(Math.random()-.5)*54;group.position.set(x,0,z);group.userData={hp:100,alive:true,body};scene.add(group);targets.push(group)}
function start(){if(active)return;buildWorld();active=true;ammo=guns[selected].mag;kills=0;hp=100;updateHud();$('weaponName').textContent=guns[selected].name;clock.start();renderer.setAnimationLoop(frame);if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()}
function stop(){active=false;document.exitPointerLock?.();if(renderer){renderer.setAnimationLoop(null);renderer.dispose();renderer=null}locked=false;keys={};fireHeld=false}
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement!==null);
document.addEventListener('mousemove',e=>{if(!active||!locked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.35,Math.min(1.35,pitch));camera.rotation.set(pitch,yaw,0,'YXZ')});
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reload();if(e.code==='Space'&&onGround){velY=6.5;onGround=false}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
renderer;function fire(){if(!active||reloading)return;const g=guns[selected],now=performance.now();if(now-lastShot<g.rate||ammo<=0)return;lastShot=now;ammo--;raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const hits=raycaster.intersectObjects(targets.filter(t=>t.userData.alive),true);if(hits.length){let obj=hits[0].object;while(obj.parent&&!obj.userData.alive)obj=obj.parent;if(obj.userData.alive){obj.userData.hp-=g.damage;if(obj.userData.hp<=0){obj.userData.alive=false;scene.remove(obj);kills++;setTimeout(()=>{if(active)spawnTarget()},900)}}}updateHud()}
function reload(){if(reloading||ammo===guns[selected].mag)return;reloading=true;$('ammo').textContent='裝填中…';setTimeout(()=>{if(active)ammo=guns[selected].mag;reloading=false;updateHud()},1100)}
function updateHud(){$('hp').textContent=Math.ceil(hp);$('kills').textContent=kills;$('ammo').textContent=ammo+' / ∞'}
function frame(){if(!active)return;const dt=Math.min(clock.getDelta(),.04);forward.set(-Math.sin(yaw),0,-Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));direction.set(0,0,0);if(keys.w||keys.arrowup)direction.add(forward);if(keys.s||keys.arrowdown)direction.sub(forward);if(keys.d||keys.arrowright)direction.add(right);if(keys.a||keys.arrowleft)direction.sub(right);direction.x+=right.x*joy.x+forward.x*(-joy.y);direction.z+=right.z*joy.x+forward.z*(-joy.y);if(direction.lengthSq()>0){direction.normalize();camera.position.addScaledVector(direction,7.8*dt)}camera.position.x=Math.max(-82,Math.min(82,camera.position.x));camera.position.z=Math.max(-82,Math.min(82,camera.position.z));velY-=17*dt;camera.position.y+=velY*dt;if(camera.position.y<1.7){camera.position.y=1.7;velY=0;onGround=true}if(fireHeld)fire();targets.forEach(t=>{if(!t.userData.alive)return;const dx=camera.position.x-t.position.x,dz=camera.position.z-t.position.z,dist=Math.hypot(dx,dz);if(dist>2.8){t.position.x+=dx/dist*.85*dt;t.position.z+=dz/dist*.85*dt}else{hp-=5*dt;if(hp<=0){hp=100;camera.position.set(0,1.7,12);targets.forEach(q=>q.position.add(new THREE.Vector3((Math.random()-.5)*8,0,(Math.random()-.5)*8)))}updateHud()}});renderer.render(scene,camera)}
renderer;window.addEventListener('resize',()=>{if(!renderer||!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
$('reload').onclick=reload;$('fire').onpointerdown=e=>{e.preventDefault();fireHeld=true;fire()};['pointerup','pointercancel','pointerleave'].forEach(ev=>$('fire').addEventListener(ev,()=>fireHeld=false));$('jump').onclick=()=>{if(onGround){velY=6.5;onGround=false}};
const pad=$('movePad'),knob=$('knob');let padOn=false;pad.onpointerdown=e=>{padOn=true;pad.setPointerCapture(e.pointerId);movePad(e)};pad.onpointermove=e=>{if(padOn)movePad(e)};function movePad(e){const r=pad.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy),lim=42;if(m>lim){dx=dx/m*lim;dy=dy/m*lim}joy.x=dx/lim;joy.y=dy/lim;knob.style.transform='translate('+dx+'px,'+dy+'px)'}function resetPad(){padOn=false;joy={x:0,y:0};knob.style.transform=''}pad.onpointerup=resetPad;pad.onpointercancel=resetPad;
const look=$('lookPad');look.onpointerdown=e=>{touchLook={x:e.clientX,y:e.clientY};look.setPointerCapture(e.pointerId)};look.onpointermove=e=>{if(!touchLook)return;const dx=e.clientX-touchLook.x,dy=e.clientY-touchLook.y;touchLook={x:e.clientX,y:e.clientY};yaw-=dx*.006;pitch=Math.max(-1.35,Math.min(1.35,pitch-dy*.006));if(camera)camera.rotation.set(pitch,yaw,0,'YXZ')};look.onpointerup=()=>touchLook=null;look.onpointercancel=()=>touchLook=null;
</script></body></html>
