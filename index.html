<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RIVALS WEB FPS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d17;color:#eef4ff;font-family:Arial,"Noto Sans TC",sans-serif;overflow:hidden}button{font:inherit;cursor:pointer;border:1px solid #ffffff28;color:#fff;background:#172438;padding:12px 20px;border-radius:8px;transition:.15s}button:hover{background:#2465a8;transform:translateY(-1px)}.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}.menu{align-items:center;padding:7vw;background:radial-gradient(ellipse at 70% 45%,#163a60 0%,#0a1424 45%,#070b13 100%)}.menu:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#080d17 0%,transparent 75%);pointer-events:none}.content{z-index:1;max-width:560px}.eyebrow{letter-spacing:5px;color:#54b8ff;font-size:12px;font-weight:bold}.logo{font-size:clamp(48px,9vw,100px);font-weight:1000;letter-spacing:-5px;line-height:.95;margin:18px 0}.logo span{color:#58baff}.sub{color:#9cacc3;line-height:1.7;margin-bottom:28px}.actions{display:flex;gap:12px;flex-wrap:wrap}.primary{background:#1675c8;border-color:#49adff;font-weight:bold;min-width:150px}.topbar{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#08111ddd;border-bottom:1px solid #ffffff15}.brand{font-weight:900;letter-spacing:2px}.brand b{color:#55baff}.tabs{display:flex;gap:8px}.panel{margin:auto;width:min(900px,92vw);padding:30px;background:#0e1a2bed;border:1px solid #ffffff20;border-radius:16px;box-shadow:0 25px 80px #0008}.panel h2{margin:0 0 8px;font-size:30px}.muted{color:#9baec5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0}.weapon{background:#14263c;border:1px solid #ffffff1a;border-radius:12px;padding:16px;min-height:125px;text-align:left}.weapon.selected{border:1px solid #57baff;background:#173653}.weapon .emoji{font-size:32px;display:block;margin-bottom:12px}.arena{background:#0b1421;align-items:center;justify-content:center}.gamewrap{position:relative;width:100vw;height:100vh;overflow:hidden;background:#101d2a}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none}.hudtop{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:10px}.pill{background:#07111dcc;border:1px solid #ffffff24;padding:10px 14px;border-radius:8px;font-size:13px}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 5px #000}.cross:before{width:2px;height:18px;left:8px}.cross:after{height:2px;width:18px;top:8px}.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#07111dcc;padding:8px 12px;border-radius:8px;color:#c7d7e8;font-size:12px}.touch{display:none;pointer-events:auto;position:absolute;bottom:28px;left:22px;width:130px;height:130px;border:1px solid #ffffff55;border-radius:50%;background:#ffffff0b}.stick{position:absolute;width:48px;height:48px;border-radius:50%;background:#7bbfff88;border:1px solid #b6e0ff;left:40px;top:40px}.fire{display:none;pointer-events:auto;position:absolute;right:26px;bottom:42px;width:82px;height:82px;border-radius:50%;background:#b53636bb;border:2px solid #ffb2b2;font-weight:bold}.reload{position:absolute;right:25px;bottom:140px;pointer-events:auto}.gamebuttons{position:absolute;top:70px;right:18px;pointer-events:auto}.gamebuttons button{padding:8px 12px}@media(pointer:coarse){.touch,.fire{display:block}.hint{bottom:8px}.reload{right:28px;bottom:145px}}@media(max-width:600px){.topbar{padding:12px}.tabs button{padding:8px;font-size:12px}.panel{padding:20px}.menu{padding:8vw}.logo{letter-spacing:-3px}}
</style>
</head>
<body>
<section id="home" class="screen menu active"><div class="content"><div class="eyebrow">WEB TACTICAL ARENA</div><div class="logo">RI<span>VALS</span></div><div class="sub">進入訓練場，熟悉武器與移動操作。這是一款可在瀏覽器遊玩的原創 2D 射擊原型。</div><div class="actions"><button class="primary" id="play">▶ PLAY</button><button id="openArsenal">🔫 武器庫</button><button id="openLobby">🏙️ 大廳</button></div><p class="muted" style="font-size:12px;margin-top:32px">WASD 移動・滑鼠瞄準・左鍵射擊・手機可使用觸控搖桿</p></div></section>
<section id="arsenal" class="screen"><div class="topbar"><div class="brand">R<b>IVALS</b> / ARMORY</div><div class="tabs"><button data-screen="home">返回主選單</button></div></div><div class="panel"><h2>武器庫 <span class="muted" style="font-size:14px">/ LOADOUT</span></h2><p class="muted">選擇訓練時使用的武器。</p><div class="cards" id="weaponCards"></div><button class="primary" id="armoryPlay">使用此配置並開始</button></div></section>
<section id="lobby" class="screen"><div class="topbar"><div class="brand">R<b>IVALS</b> / LOBBY</div><div class="tabs"><button data-screen="home">返回主選單</button></div></div><div class="panel"><h2>訓練大廳</h2><p class="muted">選擇模式，準備進入城市訓練場。</p><div class="cards"><button class="weapon selected"><span class="emoji">🏙️</span><b>城市交戰</b><p class="muted">單人訓練場</p></button><button class="weapon"><span class="emoji">🎯</span><b>目標練習</b><p class="muted">移動靶與命中練習</p></button><button class="weapon"><span class="emoji">⚡</span><b>快速對戰</b><p class="muted">原型模式</p></button></div><button class="primary" id="lobbyPlay">▶ 進入訓練場</button></div></section>
<section id="game" class="screen arena"><div class="gamewrap"><canvas id="world"></canvas><div class="hud"><div class="hudtop"><div class="pill">HP <b id="hp">100</b>　|　擊倒 <b id="kills">0</b></div><div class="pill"><b id="weaponName">RIFLE</b>　 <span id="ammo">30 / ∞</span></div></div><div class="cross"></div><div class="hint">WASD 移動・滑鼠瞄準・點擊射擊・R 裝填</div><div class="gamebuttons"><button id="exitGame">離開</button></div><div class="touch" id="joystick"><div class="stick" id="stick"></div></div><button class="fire" id="fire">FIRE</button><button class="reload" id="reload">↻ 裝填</button></div></div></section>
<script>
const screens=['home','arsenal','lobby','game'];function show(id){screens.forEach(s=>document.getElementById(s).classList.toggle('active',s===id));if(id==='game')startGame();else stopGame()}
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>show(b.dataset.screen));
document.getElementById('play').onclick=()=>show('game');document.getElementById('openArsenal').onclick=()=>show('arsenal');document.getElementById('openLobby').onclick=()=>show('lobby');document.getElementById('armoryPlay').onclick=()=>show('game');document.getElementById('lobbyPlay').onclick=()=>show('game');document.getElementById('exitGame').onclick=()=>show('home');
const weapons=[{name:'RIFLE',icon:'🔫',desc:'全能自動步槍',damage:22,rate:180,mag:30},{name:'BURST',icon:'💥',desc:'高傷害連發步槍',damage:34,rate:330,mag:18},{name:'SCOUT',icon:'🎯',desc:'精準半自動步槍',damage:55,rate:520,mag:10},{name:'SMG',icon:'⚡',desc:'高速衝鋒槍',damage:14,rate:95,mag:40}];let selected=0;
const cards=document.getElementById('weaponCards');weapons.forEach((w,i)=>{const b=document.createElement('button');b.className='weapon'+(i===0?' selected':'');b.innerHTML='<span class="emoji">'+w.icon+'</span><b>'+w.name+'</b><p class="muted">'+w.desc+'</p>';b.onclick=()=>{selected=i;[...cards.children].forEach((x,j)=>x.classList.toggle('selected',j===i));};cards.appendChild(b)});
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');let W,H,raf=0,running=false,last=0,player={x:0,y:0,hp:100},bullets=[],bots=[],keys={},mouse={x:0,y:0,down:false},ammo=30,kills=0,lastShot=0,reloadTimer=0,joy={x:0,y:0},fireTouch=false;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);
function spawn(){return{x:Math.random()*1200-600,y:Math.random()*900-450,hp:100,hit:0}}
function startGame(){if(running)return;resize();running=true;player={x:0,y:0,hp:100};bullets=[];bots=Array.from({length:8},spawn);ammo=weapons[selected].mag;kills=0;last=performance.now();document.getElementById('weaponName').textContent=weapons[selected].name;raf=requestAnimationFrame(loop)}
function stopGame(){running=false;cancelAnimationFrame(raf);mouse.down=false;fireTouch=false}
function shoot(){const w=weapons[selected],now=performance.now();if(now-lastShot<w.rate||ammo<=0||reloadTimer)return;lastShot=now;ammo--;const ang=Math.atan2(mouse.y-H/2,mouse.x-W/2);bullets.push({x:player.x,y:player.y,dx:Math.cos(ang),dy:Math.sin(ang),life:700,damage:w.damage});}
function reload(){if(ammo<weapons[selected].mag&&!reloadTimer){reloadTimer=900;setTimeout(()=>{ammo=weapons[selected].mag;reloadTimer=0},900)}}
document.getElementById('reload').onclick=reload;document.getElementById('fire').onpointerdown=e=>{e.preventDefault();fireTouch=true;shoot()};document.getElementById('fire').onpointerup=()=>fireTouch=false;document.getElementById('fire').onpointercancel=()=>fireTouch=false;
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reload()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){mouse.down=true;shoot()}});window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')mouse.down=false});
const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');let joyActive=false;joyEl.addEventListener('pointerdown',e=>{joyActive=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e)});joyEl.addEventListener('pointermove',e=>{if(joyActive)moveJoy(e)});function moveJoy(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),lim=42;if(m>lim){dx=dx/m*lim;dy=dy/m*lim}joy.x=dx/lim;joy.y=dy/lim;stick.style.transform='translate('+dx+'px,'+dy+'px)'}function resetJoy(){joyActive=false;joy.x=joy.y=0;stick.style.transform=''}joyEl.addEventListener('pointerup',resetJoy);joyEl.addEventListener('pointercancel',resetJoy);
function loop(now){if(!running)return;const dt=Math.min((now-last)/16.67,2);last=now;update(dt,now);draw();raf=requestAnimationFrame(loop)}
function update(dt,now){let vx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,vy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;let mag=Math.hypot(vx,vy)||1;player.x+=vx/mag*4*dt;player.y+=vy/mag*4*dt;if(mouse.down||fireTouch)shoot();bullets=bullets.filter(b=>b.life>0);bullets.forEach(b=>{b.x+=b.dx*12*dt;b.y+=b.dy*12*dt;b.life-=16*dt;bots.forEach(bot=>{if(bot.hp>0&&Math.hypot(bot.x-b.x,bot.y-b.y)<24){bot.hp-=b.damage;b.life=0;if(bot.hp<=0){kills++;setTimeout(()=>{const n=spawn();Object.assign(bot,n)},700)}}})});bots.forEach(bot=>{if(bot.hp>0){const a=Math.atan2(player.y-bot.y,player.x-bot.x);bot.x+=Math.cos(a)*.55*dt;bot.y+=Math.sin(a)*.55*dt;if(Math.hypot(player.x-bot.x,player.y-bot.y)<30){player.hp=Math.max(0,player.hp-.12*dt)}}});if(player.hp<=0){player.hp=100;player.x=player.y=0}document.getElementById('hp').textContent=Math.ceil(player.hp);document.getElementById('kills').textContent=kills;document.getElementById('ammo').textContent=ammo+' / ∞'}
function draw(){ctx.fillStyle='#142333';ctx.fillRect(0,0,W,H);const ox=W/2-player.x,oy=H/2-player.y;ctx.fillStyle='#1b2c3a';ctx.fillRect(ox-800,oy-600,1600,1200);ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;for(let x=-1000;x<1200;x+=80){ctx.beginPath();ctx.moveTo(ox+x,0);ctx.lineTo(ox+x,H);ctx.stroke()}for(let y=-1000;y<1200;y+=80){ctx.beginPath();ctx.moveTo(0,oy+y);ctx.lineTo(W,oy+y);ctx.stroke()}
 // city blocks
 for(let x=-600;x<=600;x+=300)for(let y=-450;y<=450;y+=300){ctx.fillStyle='#263b4b';ctx.fillRect(ox+x+20,oy+y+20,180,170);ctx.fillStyle='#30495a';ctx.fillRect(ox+x+32,oy+y+32,156,146);ctx.fillStyle='#3d5868';for(let k=0;k<4;k++)ctx.fillRect(ox+x+48+k*34,oy+y+48,16,12)}
 bullets.forEach(b=>{ctx.fillStyle='#ffdf76';ctx.beginPath();ctx.arc(ox+b.x,oy+b.y,4,0,Math.PI*2);ctx.fill()});
 bots.forEach(bot=>{if(bot.hp<=0)return;ctx.fillStyle='#db5555';ctx.beginPath();ctx.arc(ox+bot.x,oy+bot.y,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#361b25';ctx.fillRect(ox+bot.x-18,oy+bot.y-27,36,4);ctx.fillStyle='#72e09b';ctx.fillRect(ox+bot.x-18,oy+bot.y-27,36*bot.hp/100,4)});
 ctx.fillStyle='#62baff';ctx.beginPath();ctx.arc(W/2,H/2,17,0,Math.PI*2);ctx.fill();const a=Math.atan2(mouse.y-H/2,mouse.x-W/2);ctx.strokeStyle='#bde5ff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(W/2+Math.cos(a)*25,H/2+Math.sin(a)*25);ctx.stroke()}
</script></body></html>
